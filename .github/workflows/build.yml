name: Build and Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt-get install -y mingw-w64

      - name: Build And Package
        run: |
          make -C time_tracker clean all package \
            LDFLAGS="-mwindows -static -static-libgcc -static-libstdc++" \
            LDLIBS="-lsetupapi -lhid -lcfgmgr32 -lole32 -luser32 -lkernel32"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            time_tracker/output/artifacts/time_tracker.exe
            time_tracker/output/artifacts/nice_text.txt
            time_tracker/output/artifacts/windows_logo.png
